<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MarTech Mix-Up</title>
<style>
  :root{
    --blue:#060ce9; --blue-dark:#040a6e; --blue-deep:#02033a; --gold:#ffcc00; --gold-soft:#ffd94d;
    --ink:#ffffff; --muted:#b9c0ff; --panel:#0a1172; --panel2:#0d1585; --danger:#ff5252; --ok:#37d67a;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:radial-gradient(1200px 700px at 50% -10%, #1622b8 0%, var(--blue-deep) 55%, #01021f 100%);
    color:var(--ink); font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif; min-height:100vh}
  h1,h2,h3{margin:0}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 48px}
  .logo{font-family:Georgia,'Times New Roman',serif;font-weight:900;letter-spacing:.5px;color:#fff;
    text-shadow:0 2px 0 #0008, 0 0 22px #3d5afe88; font-size:clamp(28px,5vw,46px); text-align:center}
  .logo span{color:var(--gold)}
  .tagline{text-align:center;color:var(--muted);margin-top:2px;font-size:14px;letter-spacing:2px;text-transform:uppercase}
  .card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:2px solid var(--gold);
    border-radius:14px;padding:20px;box-shadow:0 10px 30px #0009, inset 0 0 0 2px #0006}
  .card.plain{border-color:#2b3ac9}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:12px 20px;font-weight:700;
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));color:#221a00;box-shadow:0 3px 0 #a88600}
  button:active{transform:translateY(2px);box-shadow:none}
  button.secondary{background:#1b26a8;color:#fff;box-shadow:0 3px 0 #0a1172;border:1px solid #4653e0}
  button.danger{background:linear-gradient(180deg,#ff7b7b,#e53935);color:#fff;box-shadow:0 3px 0 #8e1414}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.big{font-size:20px;padding:16px 28px;width:100%}
  input,select,textarea{font:inherit;padding:11px 12px;border-radius:9px;border:2px solid #2b3ac9;
    background:#050a4d;color:#fff;width:100%}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  label{font-size:13px;color:var(--muted);display:block;margin:10px 0 4px}
  .row{display:flex;gap:12px;flex-wrap:wrap}
  .row>*{flex:1}
  .center{text-align:center}
  .muted{color:var(--muted)}
  .gold{color:var(--gold)}
  .err{background:#5c0d0d;border:1px solid var(--danger);color:#ffd7d7;padding:10px 14px;border-radius:9px;margin:10px 0}
  .ok-banner{background:#0d4d26;border:1px solid var(--ok);padding:10px 14px;border-radius:9px;margin:10px 0}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
  .clock{font-variant-numeric:tabular-nums;background:#0007;border:1px solid var(--gold);color:var(--gold);
    padding:6px 14px;border-radius:999px;font-weight:800;letter-spacing:1px}
  /* board */
  .board{display:grid;gap:8px}
  .board .colhead{background:linear-gradient(180deg,#131fc0,#0a1172);border:2px solid var(--gold);border-radius:10px;
    padding:12px 6px;text-align:center;font-weight:800;font-size:clamp(13px,2vw,19px);text-transform:uppercase;min-height:58px;
    display:flex;align-items:center;justify-content:center}
  .tile{background:linear-gradient(180deg,#1a2bd8,#060ce9);border:2px solid #4653e0;border-radius:10px;color:var(--gold);
    font-weight:900;font-size:clamp(18px,3vw,30px);text-align:center;padding:20px 4px;cursor:pointer;text-shadow:0 2px 0 #0009}
  .tile:hover{border-color:var(--gold)}
  .tile.used{background:#050a4d;color:#3d47a0;cursor:default;text-decoration:line-through;border-color:#1b26a8}
  .tile.locked{background:#0a1060;color:#5a66c9;cursor:not-allowed;border-color:#232c96}
  .tile .lock{display:block;font-size:12px;text-decoration:none}
  .tile .rem{display:block;font-size:11px;color:var(--muted);text-decoration:none;font-weight:600}
  /* scoreboard */
  .scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin:14px 0}
  .scorebox{background:#050a4d;border:2px solid #2b3ac9;border-radius:12px;padding:12px;text-align:center}
  .scorebox.lead{border-color:var(--gold)}
  .scorebox .tname{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .scorebox .tscore{font-size:30px;font-weight:900;color:var(--gold);font-variant-numeric:tabular-nums}
  .scorebox .tscore.neg{color:var(--danger)}
  .scorebox .members{font-size:12px;color:var(--muted)}
  .adj{display:flex;gap:6px;justify-content:center;margin-top:8px}
  .adj button{padding:5px 10px;font-size:13px}
  /* question screen */
  .qstem{font-size:clamp(24px,4.4vw,44px);font-weight:800;line-height:1.25;text-align:center;padding:18px 8px}
  .qstem.reading{font-size:21px;font-weight:400;line-height:1.6;text-align:left;letter-spacing:0;padding:14px 10px}
  .hostside .scorebox .tscore{font-size:25px}
  .hostside .scorebox .tname{font-size:15px}
  .qimg{display:block;max-width:100%;max-height:340px;margin:8px auto;border-radius:10px;border:2px solid var(--gold)}
  .qimg.zoomable{cursor:zoom-in}
  .imgzoom{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:300;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:12px}
  .imgzoom img{max-width:98vw;max-height:96vh;object-fit:contain;border-radius:8px}
  .imgzoom .zclose{position:fixed;top:14px;right:16px;font-size:15px;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);border-radius:999px;padding:6px 16px}
  .opts{display:grid;gap:10px;margin-top:14px}
  .opt{background:#050a4d;border:2px solid #2b3ac9;border-radius:12px;padding:14px 16px;font-size:clamp(16px,2.4vw,22px);
    text-align:left;color:#fff;width:100%}
  .opt .letter{color:var(--gold);font-weight:900;margin-right:10px}
  .opt.correct{border-color:var(--ok);background:#0d4d26}
  .opt.picked{border-color:var(--gold)}
  .countnum{font-size:clamp(70px,16vw,150px);font-weight:900;color:var(--gold);text-align:center;line-height:1;
    text-shadow:0 4px 0 #000a;animation:pulse .9s infinite}
  @keyframes pulse{50%{transform:scale(1.06)}}
  .buzzer{width:min(72vw,300px);height:min(72vw,300px);border-radius:50%;margin:18px auto;display:block;
    background:radial-gradient(circle at 35% 30%, #ff8a80, #d50000 60%, #8e0000);color:#fff;font-size:34px;font-weight:900;
    border:6px solid #ffb3ab;box-shadow:0 12px 0 #5f0000, 0 20px 40px #000a}
  .buzzer:active{transform:translateY(8px);box-shadow:0 4px 0 #5f0000}
  .buzzer:disabled{background:radial-gradient(circle at 35% 30%, #5a63b8, #232a7a 60%, #141a52);border-color:#4653e0;box-shadow:none;font-size:22px}
  .pill{display:inline-block;padding:5px 14px;border-radius:999px;background:#0007;border:1px solid var(--gold);color:var(--gold);font-weight:700}
  /* host one-screen layout: main stage + sticky side scoreboard, minimal scrolling */
  .hostwrap{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px;align-items:start}
  .hostside{position:sticky;top:10px}
  .hostside .scores{grid-template-columns:1fr;margin:0 0 12px}
  .hostside .scorebox{padding:9px}
  .hostside .scorebox .tscore{font-size:26px}
  @media(max-width:920px){.hostwrap{grid-template-columns:1fr}.hostside{position:static}}
  .adjcustom{display:flex;gap:6px;justify-content:center;margin-top:6px}
  .adjcustom input{width:92px;padding:5px 8px;font-size:13px;text-align:center}
  .adjcustom button{padding:5px 10px;font-size:13px}
  .tile{padding:13px 4px}
  .board .colhead{min-height:46px;padding:8px 6px}
  .qstem{padding:10px 8px}
  .qimg{max-height:290px}
  .qimg.big{max-height:60vh;width:auto}
  .timerbar{height:14px;background:#1b26a8;border-radius:7px;overflow:hidden;margin:12px auto;max-width:540px}
  .timerbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-soft),var(--gold));transition:width .2s linear}
  .timerbar>i.low{background:var(--danger)}
  .js-cd.urgent,.js-cdmm.urgent{color:var(--danger)!important}
  .champ{background:linear-gradient(180deg,#3a2f00,#141000);border:3px solid var(--gold);border-radius:16px;padding:28px;text-align:center}
  .champ .trophy{font-size:74px}
  .champ .wname{font-size:clamp(30px,6vw,54px);font-weight:900;color:var(--gold)}
  .join-code{font-size:clamp(44px,10vw,84px);font-weight:900;letter-spacing:10px;color:var(--gold);text-align:center;
    font-variant-numeric:tabular-nums;text-shadow:0 3px 0 #000a}
  .qrbox{background:#fff;border-radius:12px;padding:12px;width:fit-content;margin:0 auto}
  .listitem{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#050a4d;
    border:1px solid #2b3ac9;border-radius:10px;padding:10px 14px;margin:8px 0}
  .small{font-size:13px}
  .hidden{display:none!important}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:760px){.grid2{grid-template-columns:1fr}}
  .qeditor{background:#050a4d;border:1px solid #2b3ac9;border-radius:10px;padding:12px;margin:10px 0}
  .modal{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
  .modal .card{max-width:440px;width:100%}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">MarTech <span>Mix-Up</span></div>
  <div class="tagline">Morning Buzz</div>
  <div id="app" style="margin-top:18px"></div>
</div>
<script src="qrcode.min.js"></script>
<script>
'use strict';
const $ = sel => document.querySelector(sel);
const app = $('#app');
const store = {
  get admin(){ return localStorage.getItem('j_admin') || ''; },
  set admin(v){ v ? localStorage.setItem('j_admin', v) : localStorage.removeItem('j_admin'); },
  get player(){ return localStorage.getItem('j_player') || ''; },
  set player(v){ v ? localStorage.setItem('j_player', v) : localStorage.removeItem('j_player'); },
};
let S = { gameExists:false };        // latest server state (role-filtered)
let serverOffset = 0;                  // serverNow - Date.now()
let es = null;                         // EventSource
let view = 'boot';                     // boot | home | admin | host | player
let templatesCache = [];
let editorTpl = null;                  // template being edited
let joinCtx = { code:'', info:null, name:'', existsName:'' };

function api(path, body, token){
  return fetch(path, { method: body ? 'POST' : 'GET',
    headers: { 'Content-Type':'application/json', ...(token ? { Authorization:'Bearer '+token } : {}) },
    body: body ? JSON.stringify(body) : undefined })
    .then(async r => { const j = await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error || ('HTTP '+r.status)); return j; });
}
function connectSSE(){
  if (es) es.close();
  const tok = store.admin || store.player || '';
  es = new EventSource('/api/events?token=' + encodeURIComponent(tok));
  es.onmessage = ev => {
    try { S = JSON.parse(ev.data); serverOffset = (S.serverNow||Date.now()) - Date.now(); render(); } catch(e){}
  };
}
const now = () => Date.now() + serverOffset;
/* keepalive: while a game is running, ping every 4 minutes so the host never sleeps mid-game */
setInterval(() => { if (S.gameExists) fetch('/api/ping').catch(() => {}); }, 240000);
function elapsedStr(){
  if (!S.startedAt) return '00:00';
  let s = Math.max(0, Math.floor((now() - S.startedAt)/1000));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), ss = s%60;
  return (h>0 ? h+':' : '') + String(m).padStart(2,'0') + ':' + String(ss).padStart(2,'0');
}
setInterval(() => {
  document.querySelectorAll('.js-clock').forEach(el => el.textContent = '⏱ ' + elapsedStr());
  const t = now();
  document.querySelectorAll('.js-cd').forEach(el => {
    const end = +el.dataset.end || 0; if (!end) return;
    const remain = Math.max(0, Math.ceil((end - t) / 1000));
    if (el.textContent !== String(remain)) el.textContent = String(remain);
    el.classList.toggle('urgent', end - t <= 5000 && end - t > 0);
  });
  document.querySelectorAll('.js-cdmm').forEach(el => {
    const end = +el.dataset.end || 0; if (!end) return;
    const remain = Math.max(0, Math.ceil((end - t) / 1000));
    const txt = Math.floor(remain / 60) + ':' + String(remain % 60).padStart(2, '0');
    if (el.textContent !== txt) el.textContent = txt;
    el.classList.toggle('urgent', end - t <= 60000 && end - t > 0);
  });
  document.querySelectorAll('.js-cdmm-note').forEach(el => {
    const end = +el.dataset.end || 0; if (!end) return;
    el.style.display = t >= end ? '' : 'none';
  });
  document.querySelectorAll('.js-tfill').forEach(el => {
    const end = +el.dataset.end || 0, total = (+el.dataset.total || 0) * 1000;
    if (!end || !total) return;
    el.style.width = Math.max(0, Math.min(100, (end - t) / total * 100)) + '%';
    el.classList.toggle('low', end - t <= 5000 && end - t > 0);
  });
}, 200);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function errBox(msg){ return msg ? '<div class="err">' + esc(msg) + '</div>' : ''; }
let uiError = '';
let zoomImg = null;                    // host full-screen image overlay (image src while open)
let adjustOpenFor = null;              // team id whose Manual Adjust panel is open in the sidebar
</script>
<script>
'use strict';
/* ================= views ================= */
function render(){
  if (view === 'boot') return;
  if (view === 'admin') return renderAdmin();
  if (view === 'host') return renderHost();
  if (view === 'player') return renderPlayer();
  return renderHome();
}

function renderHome(){
  const joinUrl = new URL(location.href);
  const prefill = (joinUrl.searchParams.get('code') || '').toUpperCase();
  app.innerHTML = `
  <div class="grid2">
    <div class="card">
      <h2 class="center gold">JOIN A GAME</h2>
      <p class="center muted">Enter the 4-letter code shown on the host screen.</p>
      ${errBox(uiError)}
      <label>Game code</label>
      <input id="j_code" maxlength="4" style="text-transform:uppercase;font-size:26px;letter-spacing:6px;text-align:center" value="${esc(joinCtx.code || prefill)}">
      <div style="height:12px"></div>
      <button class="big" id="j_find">Find Game →</button>
      <div id="j_area"></div>
    </div>
    <div class="card plain">
      <h2 class="center">HOST / ADMIN</h2>
      <p class="center muted">Sign in to build templates and run a game.</p>
      <label>Username</label><input id="a_user" autocomplete="username">
      <label>Password</label><input id="a_pass" type="password" autocomplete="current-password">
      <div style="height:12px"></div>
      <button class="big secondary" id="a_login">Sign In</button>
      <p class="small muted" style="margin-top:12px">Preset accounts: admin1 / admin123 · admin2 / admin123 · host1 / host123</p>
    </div>
  </div>
  <p class="center small muted" style="margin-top:10px">build 2026-11-22 · v15</p>`;
  $('#j_find').onclick = async () => {
    uiError = '';
    const code = $('#j_code').value.toUpperCase().trim();
    try {
      const info = await api('/api/game/find', { code });
      joinCtx = { code, info, name:'', existsName:'' };
      renderJoinArea();
    } catch(e){ uiError = e.message; renderHome(); }
  };
  $('#a_login').onclick = async () => {
    uiError = '';
    try {
      const r = await api('/api/admin/login', { username: $('#a_user').value.trim(), password: $('#a_pass').value });
      store.admin = r.token; store.player = '';
      view = 'admin'; connectSSE(); loadTemplates();
    } catch(e){ uiError = e.message; renderHome(); }
  };
  if (joinCtx.info) renderJoinArea();
}

function renderJoinArea(){
  const info = joinCtx.info, area = $('#j_area');
  if (!area) return;
  const started = info.phase !== 'lobby';
  area.innerHTML = `
    <div style="height:10px"></div>
    <div class="ok-banner center">Game <b>${esc(info.code)}</b> found — ${started ? 'already started (reconnect only)' : 'in the lobby'}</div>
    <label>Your name</label>
    <input id="j_name" value="${esc(joinCtx.name)}" placeholder="e.g. Alex">
    <div id="j_exists"></div>
    <label>Join as</label>
    <div class="row">
      <button class="secondary" id="j_create">Create a Team</button>
      <button class="secondary" id="j_jointeam">Join a Team</button>
    </div>
    <div id="j_sub" style="margin-top:10px"></div>`;
  const nameVal = () => { joinCtx.name = $('#j_name').value.trim(); return joinCtx.name; };
  const doJoin = async (payload) => {
    try {
      const r = await api('/api/game/join', { code: joinCtx.code, name: nameVal(), ...payload });
      if (r.status === 'exists') {
        $('#j_exists').innerHTML = `<div class="err">A player named <b>${esc(nameVal())}</b> already exists in this game.
          <div style="margin-top:8px"><button id="j_replace" class="danger">Replace that player &amp; reconnect me</button></div></div>`;
        $('#j_replace').onclick = () => doJoin({ ...payload, replace:true, mode: payload.mode || 'join', teamId: payload.teamId });
        return;
      }
      store.player = r.token; store.admin = '';
      view = 'player'; connectSSE();
    } catch(e){ $('#j_exists').innerHTML = errBox(e.message); }
  };
  joinCtx._doJoin = doJoin;
  $('#j_create').onclick = () => {
    if (!nameVal()) { $('#j_exists').innerHTML = errBox('Enter your name first'); return; }
    $('#j_sub').innerHTML = `<label>Team name</label><input id="j_teamname" placeholder="e.g. Quiz Wizards">
      <div style="height:8px"></div><button class="big" id="j_create_go">Create Team &amp; Join (you are the captain)</button>`;
    $('#j_create_go').onclick = () => doJoin({ mode:'create', teamName: $('#j_teamname').value.trim() });
  };
  $('#j_jointeam').onclick = () => {
    if (!nameVal()) { $('#j_exists').innerHTML = errBox('Enter your name first'); return; }
    $('#j_sub').innerHTML = info.teams.length
      ? info.teams.map(t => `<button class="opt" data-team="${t.id}">${esc(t.name)} <span class="muted small">(${t.members} player${t.members===1?'':'s'})</span></button>`).join('')
      : '<p class="muted">No teams yet — create the first one.</p>';
    area.querySelectorAll('[data-team]').forEach(b => b.onclick = () => doJoin({ mode:'join', teamId: b.dataset.team }));
  };
}

/* ================= admin ================= */
async function loadTemplates(){
  try { const r = await api('/api/admin/templates', null, store.admin); templatesCache = r.templates; } catch(e){ templatesCache = []; }
  render();
}
function blankQuestion(){ return { id: Math.random().toString(16).slice(2,10), type:'choice', points:100, stem:'', image:'', options:['','','',''], correctIndex:0 }; }
function blankTemplate(){
  return { id:'', name:'New Game Template',
    settings:{ answerMode:'phone', deduction:'full', continueAfterWrong:true, answerSeconds:10, finalSeconds:30 },
    groups:[{ id: Math.random().toString(16).slice(2,10), title:'Round 1', questions:[blankQuestion()] }],
    final:{ category:'Final', question:'', answer:'', points:1000 } };
}
function renderAdmin(){
  if (editorTpl) return renderEditor();
  const g = S.gameExists ? S : null;
  app.innerHTML = `
  <div class="topbar"><h2>🎛️ Host Console</h2>
    <span>${S.gameExists ? '<span class="pill">Game live: ' + esc(S.code) + '</span>' : '<span class="pill">No active game</span>'}
    <button class="secondary" id="ad_logout">Sign out</button></span></div>
  ${S.gameExists ? `<div class="card" style="margin-bottom:14px"><h3 class="gold">A game is ${S.phase === 'finished' ? 'finished' : 'in progress'} (code ${esc(S.code)})</h3>
    <div class="row" style="margin-top:10px"><button id="ad_goto">Open Host Screen →</button>
    <button class="danger" id="ad_end">End Game</button></div></div>` : ''}
  <div class="card plain" style="margin-bottom:14px">
    <label>🏷️ Game title / theme — shown on the host screen and on every player's phone. Set it before starting a game (optional; defaults to the template name).</label>
    <input id="ad_title" placeholder="e.g. MarTech Mix-Up 🎉" value="${esc(localStorage.getItem('j_gametitle') || '')}">
  </div>
  <div class="card plain">
    <div class="topbar"><h3>Game Templates</h3><button id="ad_new">+ New Template</button></div>
    ${templatesCache.map(t => `<div class="listitem"><div><b>${esc(t.name)}</b>
      <div class="small muted">${t.groups.length} groups · ${t.groups.reduce((n,gr)=>n+gr.questions.length,0)} questions</div></div>
      <span class="row" style="flex:0 0 auto">
        <button data-start="${t.id}">▶ Start Game</button>
        <button class="secondary" data-edit="${t.id}">Edit</button>
        <button class="danger" data-del="${t.id}">Delete</button></span></div>`).join('') || '<p class="muted">No templates yet.</p>'}
  </div>`;
  $('#ad_logout').onclick = () => { store.admin=''; view='home'; connectSSE(); render(); };
  $('#ad_new').onclick = () => { editorTpl = blankTemplate(); render(); };
  app.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => { editorTpl = JSON.parse(JSON.stringify(templatesCache.find(t=>t.id===b.dataset.edit))); render(); });
  app.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (confirm('Delete this template?')) { await fetch('/api/admin/templates', { method:'DELETE', headers:{'Content-Type':'application/json', Authorization:'Bearer '+store.admin}, body: JSON.stringify({ id: b.dataset.del }) }); loadTemplates(); } });
  app.querySelectorAll('[data-start]').forEach(b => b.onclick = async () => {
    const titleEl = $('#ad_title');
    const title = titleEl ? titleEl.value.trim() : '';
    try { localStorage.setItem('j_gametitle', title); } catch(e){}
    try { await api('/api/host/start', { templateId: b.dataset.start, title }, store.admin); view='host'; } catch(e){ alert(e.message); }
  });
  const gotoBtn = $('#ad_goto'); if (gotoBtn) gotoBtn.onclick = () => { view='host'; render(); };
  const endBtn = $('#ad_end'); if (endBtn) endBtn.onclick = async () => { if (confirm('End the current game for everyone?')) { await api('/api/host/end', {}, store.admin); render(); } };
}

function renderEditor(){
  const t = editorTpl, st = t.settings;
  app.innerHTML = `
  <div class="topbar"><h2>✏️ Edit Template</h2><span>
    <button class="secondary" id="ed_cancel">← Back</button> <button id="ed_save">💾 Save Template</button></span></div>
  ${errBox(uiError)}
  <div class="card plain">
    <label>Template name</label><input id="ed_name" value="${esc(t.name)}">
    <div class="grid2">
      <div><label>Answer mode</label><select id="ed_mode">
        <option value="phone" ${st.answerMode==='phone'?'selected':''}>Teams answer on phones (auto-judged)</option>
        <option value="oral" ${st.answerMode==='oral'?'selected':''}>Oral answers (host judges)</option></select></div>
      <div><label>Wrong-answer deduction</label><select id="ed_ded">
        <option value="full" ${st.deduction==='full'?'selected':''}>Full points</option>
        <option value="half" ${st.deduction==='half'?'selected':''}>Half points</option>
        <option value="none" ${st.deduction==='none'?'selected':''}>No deduction</option></select></div>
      <div><label>Answer time limit after a buzz (seconds, 0 = none)</label><input id="ed_secs" type="number" min="0" value="${st.answerSeconds}"></div>
    </div>
    <label><input type="checkbox" id="ed_cont" style="width:auto" ${st.continueAfterWrong?'checked':''}> Choice questions: let other teams keep buzzing after a wrong answer (instead of revealing the answer right away)</label>
  </div>
  <div id="ed_groups"></div>
  <button class="secondary" id="ed_addgroup">+ Add Question Group</button>
  <div class="card plain" style="margin-top:14px">
    <h3 class="gold">FINAL JEOPARDY</h3>
    <label>Category</label><input id="ed_fcat" value="${esc(t.final.category)}">
    <label>Question</label><textarea id="ed_fq" rows="2">${esc(t.final.question)}</textarea>
    <label>Correct answer</label><input id="ed_fa" value="${esc(t.final.answer)}">
    <label>Points (host can change this live during the game)</label><input id="ed_fp" type="number" value="${t.final.points}">
    <label><input type="checkbox" id="ed_fhost" style="width:auto" ${t.final.hostScored?'checked':''}> Peer-voting Final — captains send their team's answer to the host on Slack (nothing is typed or shown in the app); the host presents the answers, then teams vote for other teams' answers and captains report the counts; the winning team earns the Final points</label>
  </div>`;
  const groupsEl = $('#ed_groups');
  const drawGroups = () => {
    groupsEl.innerHTML = t.groups.map((gr, gi) => `
    <div class="card plain" style="margin-top:14px">
      <div class="row"><input value="${esc(gr.title)}" data-gtitle="${gi}" style="font-weight:800;font-size:18px">
      <button class="danger" data-delgroup="${gi}" style="flex:0 0 auto">Delete Group</button></div>
      ${gr.questions.map((q, qi) => `
      <div class="qeditor">
        <div class="row">
          <select data-qtype="${gi}:${qi}" style="flex:0 0 170px">
            <option value="tf" ${q.type==='tf'?'selected':''}>True / False</option>
            <option value="choice" ${q.type==='choice'?'selected':''}>Multiple Choice</option>
            <option value="open" ${q.type==='open'?'selected':''}>Open (no options)</option>
          </select>
          <input type="number" value="${q.points}" data-qpoints="${gi}:${qi}" style="flex:0 0 110px" title="Points">
          <button class="danger" data-delq="${gi}:${qi}" style="flex:0 0 auto">✕</button>
        </div>
        <label>Question</label><textarea rows="2" data-qstem="${gi}:${qi}">${esc(q.stem)}</textarea>
        <label>Image (optional)</label>
        <input type="file" accept="image/*" data-qimg="${gi}:${qi}">
        ${q.image ? `<img src="${q.image}" style="max-height:90px;border-radius:6px;margin-top:6px">` : ''}
        ${q.type === 'open' ? `<label>Correct answer (host-only — players answer out loud, no options are shown)</label>
          <input value="${esc(q.answer || '')}" data-qans="${gi}:${qi}" placeholder="e.g. the correct answer text">`
          : q.type === 'choice' ? `<label>Options (pick the correct one)</label>` +
          q.options.map((op, oi) => `<div class="row" style="align-items:center;margin:4px 0">
            <input type="radio" name="corr-${gi}-${qi}" data-qcorr="${gi}:${qi}" value="${oi}" ${q.correctIndex===oi?'checked':''} style="width:auto;flex:0 0 auto">
            <input value="${esc(op)}" data-qopt="${gi}:${qi}:${oi}" placeholder="Option ${'ABCD'[oi]}"></div>`).join('') +
          `<label><input type="checkbox" data-qhj="${gi}:${qi}" style="width:auto" ${q.hostJudge?'checked':''}> Host judges this question — the captain's phone pick (A/B/C…) is recorded, NOT auto-scored (use for slide/PPT questions)</label>`
          : `<label>Correct answer</label><select data-qtf="${gi}:${qi}">
              <option value="0" ${q.correctIndex===0?'selected':''}>${esc(q.options[0] || 'True / Statement is AI-generated')}</option>
              <option value="1" ${q.correctIndex===1?'selected':''}>${esc(q.options[1] || 'False / Statement is Human-written')}</option></select>
             <div class="row"><input value="${esc(q.options[0]||'')}" data-qopt="${gi}:${qi}:0" placeholder="Label for option 1 (e.g. AI-generated)">
             <input value="${esc(q.options[1]||'')}" data-qopt="${gi}:${qi}:1" placeholder="Label for option 2 (e.g. Human-written)"></div>`}
      </div>`).join('')}
      <button class="secondary" data-addq="${gi}">+ Add Question</button>
    </div>`).join('');
    groupsEl.querySelectorAll('[data-gtitle]').forEach(el => el.oninput = () => t.groups[+el.dataset.gtitle].title = el.value);
    groupsEl.querySelectorAll('[data-qtype]').forEach(el => el.onchange = () => { const [gi,qi]=el.dataset.qtype.split(':').map(Number); const q=t.groups[gi].questions[qi]; q.type = el.value; if (q.type==='choice' && q.options.length<3) q.options = ['','','','']; if (q.type==='tf') q.options = [q.options[0]||'True', q.options[1]||'False']; if (q.type==='open') { q.answer = q.answer || (q.options[q.correctIndex] || ''); q.options = []; } drawGroups(); });
    groupsEl.querySelectorAll('[data-qans]').forEach(el => el.oninput = () => { const [gi,qi]=el.dataset.qans.split(':').map(Number); t.groups[gi].questions[qi].answer = el.value; });
    groupsEl.querySelectorAll('[data-qhj]').forEach(el => el.onchange = () => { const [gi,qi]=el.dataset.qhj.split(':').map(Number); t.groups[gi].questions[qi].hostJudge = el.checked; });
    groupsEl.querySelectorAll('[data-qpoints]').forEach(el => el.oninput = () => { const [gi,qi]=el.dataset.qpoints.split(':').map(Number); t.groups[gi].questions[qi].points = +el.value || 0; });
    groupsEl.querySelectorAll('[data-qstem]').forEach(el => el.oninput = () => { const [gi,qi]=el.dataset.qstem.split(':').map(Number); t.groups[gi].questions[qi].stem = el.value; });
    groupsEl.querySelectorAll('[data-qopt]').forEach(el => el.oninput = () => { const [gi,qi,oi]=el.dataset.qopt.split(':').map(Number); t.groups[gi].questions[qi].options[oi] = el.value; });
    groupsEl.querySelectorAll('[data-qcorr]').forEach(el => el.onchange = () => { const [gi,qi]=el.dataset.qcorr.split(':').map(Number); t.groups[gi].questions[qi].correctIndex = +el.value; });
    groupsEl.querySelectorAll('[data-qtf]').forEach(el => el.onchange = () => { const [gi,qi]=el.dataset.qtf.split(':').map(Number); t.groups[gi].questions[qi].correctIndex = +el.value; });
    groupsEl.querySelectorAll('[data-qimg]').forEach(el => el.onchange = () => { const [gi,qi]=el.dataset.qimg.split(':').map(Number); const f = el.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { t.groups[gi].questions[qi].image = rd.result; drawGroups(); }; rd.readAsDataURL(f); });
    groupsEl.querySelectorAll('[data-delq]').forEach(el => el.onclick = () => { const [gi,qi]=el.dataset.delq.split(':').map(Number); t.groups[gi].questions.splice(qi,1); drawGroups(); });
    groupsEl.querySelectorAll('[data-addq]').forEach(el => el.onclick = () => { t.groups[+el.dataset.addq].questions.push(blankQuestion()); drawGroups(); });
    groupsEl.querySelectorAll('[data-delgroup]').forEach(el => el.onclick = () => { t.groups.splice(+el.dataset.delgroup,1); drawGroups(); });
  };
  drawGroups();
  $('#ed_addgroup').onclick = () => { t.groups.push({ id: Math.random().toString(16).slice(2,10), title:'New Group', questions:[blankQuestion()] }); drawGroups(); };
  $('#ed_cancel').onclick = () => { editorTpl = null; uiError=''; render(); };
  $('#ed_save').onclick = async () => {
    t.name = $('#ed_name').value.trim() || 'Untitled';
    st.answerMode = $('#ed_mode').value; st.deduction = $('#ed_ded').value;
    st.answerSeconds = +$('#ed_secs').value || 0; st.finalSeconds = 0; // Final Jeopardy has no answer time limit
    st.continueAfterWrong = $('#ed_cont').checked;
    t.final = { category: $('#ed_fcat').value, question: $('#ed_fq').value, answer: $('#ed_fa').value, points: +$('#ed_fp').value || 0, hostScored: $('#ed_fhost').checked };
    for (const gr of t.groups) for (const q of gr.questions) { if (q.type==='choice') q.options = q.options.filter((o,i)=> o.trim()!=='' || i<2); if (q.type==='open') q.options = []; }
    try { await api('/api/admin/templates', { template: t }, store.admin); editorTpl = null; uiError=''; loadTemplates(); }
    catch(e){ uiError = e.message; render(); }
  };
}
</script>
<script>
'use strict';
/* ================= host ================= */
function scoreboardHTML(host){
  if (!S.teams || !S.teams.length) return '<p class="muted center">No teams yet.</p>';
  const max = Math.max(...S.teams.map(t=>t.score));
  return '<div class="scores">' + S.teams.map(t => `
    <div class="scorebox ${t.score===max && max>0 ? 'lead':''}">
      <div class="tname">${esc(t.name)}</div>
      <div class="tscore ${t.score<0?'neg':''}">${t.score}</div>
      <div class="members">${t.members.map(m=>esc(m.name)).join(', ') || '—'}</div>
      ${host ? `<div style="margin-top:6px"><button class="secondary" data-adjopen="${t.id}" style="padding:4px 14px;font-size:13px">${adjustOpenFor === t.id ? 'Close' : 'Manual Adjust'}</button></div>
      ${adjustOpenFor === t.id ? `<div class="adj"><button data-adj="${t.id}:-500">−500</button><button data-adj="${t.id}:-100">−100</button><button data-adj="${t.id}:100">+100</button><button data-adj="${t.id}:500">+500</button></div>
      <div class="adjcustom"><input type="number" placeholder="± amount" data-adjin="${t.id}"><button data-adjgo="${t.id}">Apply</button></div>` : ''}` : ''}
    </div>`).join('') + '</div>';
}
function recapHTML(){
  if (!S.scoreLog || !S.scoreLog.length || !S.teams) return '';
  const order = [...S.teams].sort((a,b)=>b.score-a.score);
  return `<div class="card" style="margin-top:14px;text-align:left"><h3 class="center gold">📋 Scoring Recap</h3>` +
    order.map(t => { const evs = S.scoreLog.filter(e => e.teamId === t.id);
      return `<div style="margin-top:12px"><b>${esc(t.name)}</b> <span class="muted">— final score:</span> <b class="gold">${t.score}</b></div>` +
      (evs.length ? evs.map(e => `<div class="listitem"><span>${esc(e.label)}</span><b style="color:${e.delta>0?'var(--ok)':e.delta<0?'var(--danger)':'inherit'}">${e.delta>0?'+':''}${e.delta}</b></div>`).join('')
                  : '<div class="listitem"><span class="muted">No scoring events</span><b>0</b></div>');
    }).join('') + '</div>';
}
function bindAdjust(){
  app.querySelectorAll('[data-adjopen]').forEach(b => b.onclick = () => { adjustOpenFor = adjustOpenFor === b.dataset.adjopen ? null : b.dataset.adjopen; renderHost(); });
  app.querySelectorAll('[data-adj]').forEach(b => b.onclick = async () => {
    const [teamId, delta] = b.dataset.adj.split(':');
    await api('/api/host/adjust', { teamId, delta: +delta }, store.admin).catch(e=>alert(e.message));
  });
  app.querySelectorAll('[data-adjgo]').forEach(b => b.onclick = async () => {
    const inp = app.querySelector(`[data-adjin="${b.dataset.adjgo}"]`);
    const delta = inp ? +inp.value : 0;
    if (!delta) { alert('Enter an amount first (e.g. 300 or -300)'); return; }
    await api('/api/host/adjust', { teamId: b.dataset.adjgo, delta }, store.admin).catch(e=>alert(e.message));
  });
}
function drawQR(el, text){
  if (!el) return;
  try {
    const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
    const n = qr.getModuleCount(), cell = 6, size = n*cell;
    let rects = '';
    for (let r=0;r<n;r++) for (let c=0;c<n;c++) if (qr.isDark(r,c)) rects += `<rect x="${c*cell}" y="${r*cell}" width="${cell}" height="${cell}" fill="#000"/>`;
    el.innerHTML = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="background:#fff;display:block">${rects}</svg>`;
  } catch(e){ el.innerHTML = '<span style="color:#000">QR unavailable</span>'; }
}
function joinURL(){ return location.origin + '/?code=' + S.code; }

function votingFinalHostHTML(f){
  if (S.phase === 'final_answer') {
    return `<div class="hostwrap"><div class="hostmain"><div class="card center">
      <h2 class="gold">FINAL JEOPARDY — Answers via Slack</h2>
      <p style="font-size:18px">Captains: send your team's answer to the host on <b>Slack</b>.<br>Nothing to type in this app.</p>
      ${S.finalAnswerEndsAt ? `<div style="margin:12px auto 2px"><div class="muted" style="font-size:13px;letter-spacing:2px">TIME TO SEND YOUR ANSWERS</div>
      <div class="js-cdmm" data-end="${S.finalAnswerEndsAt}" style="font-size:38px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.15">${(() => { const r = Math.max(0, Math.ceil((S.finalAnswerEndsAt - now()) / 1000)); return Math.floor(r / 60) + ':' + String(r % 60).padStart(2, '0'); })()}</div>
      <div class="js-cdmm-note" data-end="${S.finalAnswerEndsAt}" style="display:none;font-size:17px;color:var(--danger);font-weight:700">⏰ Time's up — captains, send your answers now!</div></div>` : ''}
      <p class="muted" style="margin-top:8px">Host: present each team's answer on your other screen. When every answer has been shown, open the vote:</p>
      <button class="big" id="h_tovote" style="margin-top:10px">All Answers Presented → Start Voting</button>
    </div></div>
    <div class="hostside">${scoreboardHTML(true)}</div></div>`;
  }
  if (S.phase === 'final_vote') {
    return `<div class="hostwrap"><div class="hostmain"><div class="card center">
      <h2 class="gold">FINAL JEOPARDY — Voting</h2>
      <p style="font-size:18px">Teams: discuss and vote for <b>another</b> team's answer — you can't vote for your own.</p>
      <p class="muted" style="margin-top:6px">Captains: collect your team members' votes and report the counts on your phone.<br>The winning team earns <b class="gold">+${S.finalPoints}</b> points.</p>
      <div style="text-align:left;margin-top:10px">${S.teams.map(t => `<div class="listitem"><span><b>${esc(t.name)}</b></span>${f.reported[t.id] ? '<b style="color:var(--ok)">✓ Votes reported</b>' : '<span class="muted">captain reporting…</span>'}</div>`).join('')}</div>
      <button class="big" id="h_closevote" style="margin-top:12px">Close Voting &amp; Show Winner</button>
      <p class="small muted" style="margin-top:6px">The winner also appears automatically once every captain has reported. Only the winner's votes are ever shown.</p>
    </div></div>
    <div class="hostside">${scoreboardHTML(true)}</div></div>`;
  }
  const r = f.result || { winnerTeamIds: [], winnerVotes: 0, totalVotes: 0 };
  const winners = S.teams.filter(t => r.winnerTeamIds.includes(t.id));
  return `<div class="champ"><div class="trophy">🗳️</div>
    <div class="muted" style="letter-spacing:3px">FINAL JEOPARDY WINNER</div>
    ${winners.length ? `<div class="wname">${winners.map(t=>esc(t.name)).join(' & ')}</div>
    <div style="font-size:26px"><b class="gold">${r.winnerVotes}</b> / ${r.totalVotes} votes</div>
    <div style="font-size:19px;margin-top:4px">Winner earns <b class="gold">+${S.finalPoints}</b> points — added to the total score</div>`
    : `<div class="wname">No votes cast</div>`}
    <button class="big" id="h_finish" style="margin-top:16px">🏆 Finish &amp; Show Champion</button></div>`;
}

function renderHost(){
  if (!S.gameExists) { app.innerHTML = '<div class="card center"><h3>No active game</h3><p class="muted">Start one from the console.</p><button id="h_back">← Host Console</button></div>';
    $('#h_back').onclick = () => { view='admin'; loadTemplates(); }; return; }
  const top = `<div class="topbar"><span class="pill">HOST · ${esc(S.title || 'Game')} · Code ${esc(S.code)}</span>
    <span class="clock js-clock">⏱ ${elapsedStr()}</span>
    <span><button class="secondary" id="h_console">Console</button> <button class="danger" id="h_end">End Game</button></span></div>`;
  let body = '';
  if (S.phase === 'lobby') {
    body = `<div class="card center">
      ${S.title ? `<div style="font-size:clamp(26px,4.5vw,40px);font-weight:900;color:var(--gold);line-height:1.2;margin-bottom:8px">${esc(S.title)}</div>` : ''}
      <h2 class="gold">Players — join this game!</h2>
      <div class="join-code">${esc(S.code)}</div>
      <div class="qrbox" id="h_qr"></div>
      <p class="muted">Scan the QR code, or open <b>${esc(joinURL())}</b> and enter the code.<br>Fill in your name, then create or join a team.</p>
      <div style="text-align:left;max-width:660px;margin:16px auto 6px">
        <h3 class="center gold" style="margin-bottom:8px">📖 HOW TO PLAY</h3>
        <p style="font-size:16px;line-height:1.5;margin:5px 0">📱 <b>The captain's phone is the team buzzer.</b> Anyone can join a team — only the captain buzzes and answers.</p>
        <p style="font-size:16px;line-height:1.5;margin:5px 0">🔔 The host opens buzzing for each question — captains, buzz fast!</p>
        <p style="font-size:16px;line-height:1.5;margin:5px 0">✅ Some questions are answered <b>on the captain's phone</b> (multiple choice / true–false) and scored automatically.</p>
        <p style="font-size:16px;line-height:1.5;margin:5px 0">🗣️ Some questions are answered <b>out loud</b>, as the host directs — the host judges those.</p>
        <p style="font-size:16px;line-height:1.5;margin:5px 0">⏱ <b>Buzz first, think fast:</b> after buzzing, the captain has <b>${S.answerSeconds || 20} seconds</b> to answer — don't buzz and then think it over. No answer in time counts as wrong: points are deducted, that team sits out the question, and the other teams get another chance to buzz.</p>
        <p style="font-size:16px;line-height:1.5;margin:5px 0">🪜 <b>Categories go in order:</b> in each category, questions unlock from low to high — finish the 100 to open the 200, then the 300, and so on.</p>
        <p style="font-size:16px;line-height:1.5;margin:5px 0">💰 Correct answers add points; wrong answers subtract them.</p>
        <p style="font-size:16px;line-height:1.5;margin:5px 0">🏁 <b>Final Jeopardy:</b> captains send their team's answer to the host on <b>Slack</b>. Then every team votes for <b>another</b> team's answer, captains report the vote counts, and the winner earns the Final points.</p>
      </div>
      </div>
      <h3 style="margin:16px 0 6px">Teams (${S.teams.length})</h3>
      ${scoreboardHTML(false)}
      <button class="big" id="h_begin" ${S.teams.length? '' : 'disabled'}>▶ Start the Game</button>
      ${S.teams.length? '' : '<p class="muted center">Waiting for at least one team…</p>'}`;
  } else if (S.phase === 'board') {
    const tpl = S.template;
    const cols = tpl.groups.length;
    body = `<div class="hostwrap"><div class="hostmain">
      <h3 class="center gold" style="margin-bottom:10px">Pick a question</h3>
      <div class="board" style="grid-template-columns:repeat(${cols},1fr)">
      ${tpl.groups.map(gr => `<div class="colhead">${esc(gr.title)}</div>`).join('')}
      ${(() => { const unlocked = new Set();
        for (const gr of tpl.groups) { const ordered = [...gr.questions].sort((a,b)=>a.points-b.points);
          for (const q of ordered) { if (!S.usedQuestionIds.includes(q.id)) { unlocked.add(q.id); break; } } }
        const maxRows = Math.max(...tpl.groups.map(g=>g.questions.length)); let cells='';
        for (let r=0;r<maxRows;r++) for (const gr of tpl.groups) { const q = gr.questions[r];
          if (!q) { cells += '<div></div>'; continue; }
          const used = S.usedQuestionIds.includes(q.id);
          cells += used ? `<div class="tile used">${q.points}</div>`
                   : unlocked.has(q.id) ? `<div class="tile" data-open="${q.id}">${q.points}</div>`
                   : `<div class="tile locked">${q.points}<span class="lock">🔒</span></div>`; }
        return cells; })()}
      </div></div>
      <div class="hostside">${scoreboardHTML(true)}
      <div class="card plain">
        ${tpl.final.hostScored ? `<h3 class="gold">FINAL JEOPARDY — Team Voting Round</h3>
        <p class="small muted" style="margin-top:6px">Captains send their answers to the host on Slack; the host presents them, then every team votes for other teams' answers. The winning team earns the points below, added to its total score.</p>
        <div class="row" style="margin-top:8px">
          <input type="number" id="fj_points" value="${S.finalPoints}" style="flex:0 0 110px">
          <button class="secondary" id="fj_set">Set</button>
          <button id="fj_start">Start Final →</button>
        </div>`
        : `<h3 class="gold">FINAL JEOPARDY — worth <span id="fj_val">${S.finalPoints}</span> points</h3>
        <div class="row" style="margin-top:8px">
          <input type="number" id="fj_points" value="${S.finalPoints}" style="flex:0 0 110px">
          <button class="secondary" id="fj_set">Set</button>
          <button id="fj_start">Start Final →</button>
        </div>
        <p class="small muted" style="margin-top:8px">Category: ${esc(tpl.final.category)} · Points can change any time.</p>`}
      </div></div></div>`;
  } else if (S.phase === 'question' && S.current) {
    const c = S.current;
    const winner = c.buzzWinnerTeamId ? S.teams.find(t=>t.id===c.buzzWinnerTeamId) : null;
    let phaseUI = '';
    if (c.phase === 'waiting') {
      phaseUI = `${c.lastResult === 'wrong-continue' ? '<p class="center" style="font-size:18px">❌ Wrong answer — that team is out for this question.</p>' : ''}
        <p class="center muted" style="font-size:18px">Read the question aloud. Buzzing is <b>closed</b> until you open it.</p>
        <button class="big" id="h_openbuzz" style="font-size:24px;padding:20px 28px;margin-top:8px">🔔 Open Buzzing</button>`;
    } else if (c.phase === 'buzz') {
      phaseUI = `<p class="center"><span class="pill" style="font-size:20px">🔔 BUZZ NOW!</span></p>`;
    } else if (c.phase === 'rebuzz') {
      const tName = (S.teams.find(t=>t.id===c.lastTimeoutTeamId)||{}).name || 'That team';
      phaseUI = `<p class="center" style="font-size:20px">⏱ <b class="gold">${esc(tName)}</b> didn't answer in time — <b>−${c.points}</b>.<br>Buzzing reopens in <b><span class="js-cd" data-end="${c.phaseEndsAt}">${Math.max(0, Math.ceil(((c.phaseEndsAt||now())-now())/1000))}</span>s</b> for the other teams…</p>`;
    } else if (c.phase === 'answer') {
      const secsLeft = c.answerDeadline ? Math.max(0, Math.ceil((c.answerDeadline - now())/1000)) : null;
      phaseUI = `<p class="center" style="font-size:20px"><b class="gold">${esc(winner ? winner.name : '')}</b> is answering${secsLeft!==null ? ` — <b><span class="js-cd" data-end="${c.answerDeadline}">${secsLeft}</span>s</b> left` : ''}…</p>` +
        (c.answerDeadline ? `<div class="timerbar"><i class="js-tfill" data-end="${c.answerDeadline}" data-total="${S.answerSeconds || 15}"></i></div>` : '') +
        (c.type === 'open' && c.answer ? `<p class="center"><button class="secondary" id="h_showans">👁 Show correct answer (for your judging)</button><span id="h_ans" class="hidden" style="font-size:20px">Correct answer: <b class="gold">${esc(c.answer)}</b></span></p>` : '') +
        (c.hostJudge
          ? `<p class="center" style="font-size:19px">${c.submission ? `📱 Captain picked: <b class="gold">${'ABCD'[c.submission.choiceIndex] || ''}</b> — your call:` : 'Captain is picking an answer on their phone — judge when ready:'}</p>
             <div class="row"><button id="h_judge_ok" style="background:linear-gradient(180deg,#5ee79a,#1faf5f);box-shadow:0 3px 0 #0d6e3a">✓ Correct</button>
             <button id="h_judge_no" class="danger">✗ Wrong</button></div>`
          : c.type === 'open'
          ? `<div class="row"><button id="h_judge_ok" style="background:linear-gradient(180deg,#5ee79a,#1faf5f);box-shadow:0 3px 0 #0d6e3a">✓ Correct</button>
             <button id="h_judge_no" class="danger">✗ Wrong</button></div>`
          : '<p class="center muted">The captain is picking an answer on their phone — it will be scored automatically.</p>');
    } else if (c.phase === 'reveal') {
      const ansText = c.type === 'open' ? (c.answer || '') : c.options[c.correctIndex];
      phaseUI = `<div class="center" style="font-size:20px">${c.lastResult === 'correct' ? '✅ <b class="gold">' + esc(winner ? winner.name : '') + '</b> got it right! +' + c.points : '❌ Nobody got it.'}</div>
        ${c.hostJudge
          ? `<p class="center" style="font-size:22px;margin-top:8px">${c.submission ? `Their pick: <b class="gold">${'ABCD'[c.submission.choiceIndex] || ''}</b> — ` : ''}${c.lastResult === 'correct' ? '✅ Correct' : '❌ Wrong'}</p>`
          : ansText
          ? `<p class="center" style="font-size:22px;margin-top:8px">Correct answer: <b class="gold">${esc(ansText)}</b></p>`
          : '<p class="center muted" style="font-size:18px;margin-top:8px">The answer was on the PPT slides.</p>'}`;
    }
    const imgFocus = c.groupTitle === 'AI versus Human' && !!c.image; // image round: no instruction text, picture takes the stage
    body = `<div class="hostwrap"><div class="hostmain"><div class="card">
      <div class="center"><span class="pill">${esc(c.groupTitle)} · ${c.points} points</span></div>
      ${imgFocus ? '' : `<div class="qstem${c.stem.length > 140 ? ' reading' : ''}">${esc(c.stem)}</div>`}
      ${c.image ? `<img class="qimg zoomable${imgFocus ? ' big' : ''}" src="${c.image}" title="Click to view full screen">${imgFocus ? '' : '<p class="center small muted" style="margin-top:2px">🔍 Click the image to view it full screen</p>'}` : ''}
      ${phaseUI}
      ${c.options && c.options.length ? `<div class="opts">${c.options.map((op, i) => `<div class="opt ${c.phase==='reveal' && !c.hostJudge && i===c.correctIndex ? 'correct':''} ${c.submission && c.submission.choiceIndex===i ? 'picked':''}"><span class="letter">${'ABCD'[i]}</span>${esc(op)}${c.phase==='reveal' && !c.hostJudge && i===c.correctIndex ? ' ✓':''}${c.submission && c.submission.choiceIndex===i ? ' 📱' : ''}</div>`).join('')}</div>` : ''}
      <div class="row" style="margin-top:16px"><button class="secondary" id="h_backboard">← Back to the Board</button></div>
    </div></div>
    <div class="hostside">${scoreboardHTML(true)}</div></div>
    ${zoomImg ? `<div class="imgzoom" id="imgzoom"><img src="${zoomImg}"><span class="zclose">✕ Close</span></div>` : ''}`;
  } else if (S.phase === 'final_answer' || S.phase === 'final_judge' || S.phase === 'final_vote' || S.phase === 'final_reveal') {
    const f = S.final;
    const secsLeft = S.phase === 'final_answer' ? Math.max(0, Math.ceil(((S.finalDeadline||now()) - now())/1000)) : 0;
    if (f.hostScored) {
      body = votingFinalHostHTML(f);
    } else {
    body = `<div class="hostwrap"><div class="hostmain"><div class="card center">
      <h2 class="gold">FINAL JEOPARDY</h2>
      <p class="muted">Category: ${esc(f.category)} · Worth <b class="gold">${S.finalPoints}</b> points</p>
      <div class="qstem">${esc(f.question)}</div>
      ${S.phase === 'final_answer' ? `<p style="font-size:20px">Captains are writing their answers… <span class="muted">(no time limit)</span></p>
        <p class="muted">${S.teams.filter(t=>f.submissions[t.id]!==undefined).length} of ${S.teams.length} teams have answered</p>
        <button class="big" id="h_tojudge">Close Answers &amp; Judge →</button>`
      : `${f.hostScored ? '<p class="muted">Teams answered offline — mark each team:</p>' : `<p class="muted">Correct answer: <b class="gold">${esc(f.answer)}</b> — mark each team:</p>`}
        ${S.teams.map(t => { const sub = f.submissions[t.id]; const judged = f.judged[t.id];
          return `<div class="listitem"><div style="text-align:left"><b>${esc(t.name)}</b> (${t.score})${f.hostScored ? '' : `<br>
            <span class="muted">Answer:</span> ${sub ? esc(sub) : '<i class="muted">no answer</i>'}`}</div>
            ${judged === undefined ? `<span class="row" style="flex:0 0 auto"><button data-fj="${t.id}:1">✓ +${S.finalPoints}</button><button class="danger" data-fj="${t.id}:0">✗ −${S.finalPoints}</button></span>`
              : `<b class="${judged ? 'gold' : ''}" style="color:${judged ? 'var(--ok)' : 'var(--danger)'}">${judged ? '✓ Correct' : '✗ Wrong'}</b>`}</div>`; }).join('')}
        <button class="big" id="h_finish" style="margin-top:12px">🏆 Finish &amp; Show Champion</button>`}
    </div></div>
    <div class="hostside">${scoreboardHTML(true)}</div></div>`;
    }
  } else if (S.phase === 'finished') {
    const standings = [...S.teams].sort((a,b)=>b.score-a.score);
    const champ = standings[0];
    body = `<div class="champ"><div class="trophy">🏆</div>
      <div class="muted" style="letter-spacing:3px">CHAMPION</div>
      <div class="wname">${champ ? esc(champ.name) : ''}</div>
      <div style="font-size:24px">${champ ? champ.score : 0} points</div>
      ${S.final && S.final.result && S.final.result.winnerTeamIds.length ? `<div style="font-size:19px;margin-top:6px">🗳️ Final Jeopardy winner: <b class="gold">${S.final.result.winnerTeamIds.map(id => esc((S.teams.find(t=>t.id===id)||{}).name || '')).join(' & ')}</b> (${S.final.result.winnerVotes}/${S.final.result.totalVotes} votes)</div>` : ''}
      <div style="margin-top:16px;text-align:left">${standings.map((t,i)=>`<div class="listitem"><span>${i+1}. <b>${esc(t.name)}</b></span><b class="gold">${t.score}</b></div>`).join('')}</div>
      ${recapHTML()}
      <button class="danger" id="h_end2" style="margin-top:14px">End Game &amp; Back to Console</button></div>`;
  }
  app.innerHTML = top + body;
  $('#h_console').onclick = () => { view='admin'; loadTemplates(); };
  const endFn = async () => { if (confirm('End this game for everyone?')) { await api('/api/host/end', {}, store.admin); view='admin'; loadTemplates(); } };
  $('#h_end').onclick = endFn;
  const e2 = $('#h_end2'); if (e2) e2.onclick = endFn;
  const qr = $('#h_qr'); if (qr) drawQR(qr, joinURL());
  const begin = $('#h_begin'); if (begin) begin.onclick = async () => { try { await api('/api/host/begin', {}, store.admin); } catch(e){ alert(e.message); } };
  app.querySelectorAll('[data-open]').forEach(el => el.onclick = async () => { await api('/api/host/open', { questionId: el.dataset.open }, store.admin).catch(e=>alert(e.message)); });
  bindAdjust();
  const fjSet = $('#fj_set'); if (fjSet) fjSet.onclick = async () => { await api('/api/host/setFinalPoints', { points: +$('#fj_points').value || 0 }, store.admin).catch(e=>alert(e.message)); };
  const fjStart = $('#fj_start'); if (fjStart) fjStart.onclick = async () => { if (confirm('Start Final Jeopardy now?')) await api('/api/host/startFinal', {}, store.admin).catch(e=>alert(e.message)); };
  const jok = $('#h_judge_ok'); if (jok) jok.onclick = () => api('/api/host/judge', { correct:true }, store.admin);
  const jno = $('#h_judge_no'); if (jno) jno.onclick = () => api('/api/host/judge', { correct:false }, store.admin);
  const bb = $('#h_backboard'); if (bb) bb.onclick = () => api('/api/host/backToBoard', {}, store.admin);
  const ob = $('#h_openbuzz'); if (ob) ob.onclick = () => api('/api/host/openBuzz', {}, store.admin).catch(e=>alert(e.message));
  const sa = $('#h_showans'); if (sa) sa.onclick = () => { sa.classList.add('hidden'); const a = $('#h_ans'); if (a) a.classList.remove('hidden'); };
  const tj = $('#h_tojudge'); if (tj) tj.onclick = () => api('/api/host/finalJudgePhase', {}, store.admin);
  const qim = app.querySelector('img.qimg.zoomable'); if (qim) qim.onclick = () => { zoomImg = qim.src; renderHost(); };
  const zo = $('#imgzoom'); if (zo) zo.onclick = () => { zoomImg = null; renderHost(); };
  const tv = $('#h_tovote'); if (tv) tv.onclick = () => api('/api/host/startVoting', {}, store.admin).catch(e=>alert(e.message));
  const cv = $('#h_closevote'); if (cv) cv.onclick = () => api('/api/host/closeVoting', {}, store.admin).catch(e=>alert(e.message));
  app.querySelectorAll('[data-fj]').forEach(b => b.onclick = async () => { const [teamId, ok] = b.dataset.fj.split(':'); await api('/api/host/judgeFinal', { teamId, correct: ok==='1' }, store.admin).catch(e=>alert(e.message)); });
  const fin = $('#h_finish'); if (fin) fin.onclick = () => api('/api/host/finish', {}, store.admin);
}

/* ================= player ================= */
function renderPlayer(){
  if (!S.gameExists) { app.innerHTML = '<div class="card center"><h3>The game has ended</h3><button onclick="localStorage.removeItem(\'j_player\');location.reload()">Back to Home</button></div>'; return; }
  const me = S.me;
  if (!me) { app.innerHTML = '<div class="card center"><h3>Reconnecting…</h3><p class="muted">If this persists, rejoin with your name and choose Replace.</p><button onclick="localStorage.removeItem(\'j_player\');location.reload()">Rejoin</button></div>'; return; }
  const myTeam = me.teamId ? S.teams.find(t=>t.id===me.teamId) : null;
  let body = `<div class="topbar"><span class="pill">${esc(me.name)}${myTeam ? ' · ' + esc(myTeam.name) + (me.isCaptain ? ' (Captain)' : '') : ''}</span>
    <span class="clock js-clock">⏱ ${elapsedStr()}</span></div>`;
  body += scoreboardHTML(false);
  if (S.phase === 'lobby') {
    body += `<div class="card center">${S.title ? `<h3 class="gold" style="font-size:24px">${esc(S.title)}</h3>` : ''}<h3 class="gold">You're in!</h3><p class="muted">Waiting for the host to start… look at the big screen.</p>
      ${me.isCaptain ? '<p>⭐ You are the team captain — your phone is the buzzer.</p>' : ''}</div>`;
  } else if (S.phase === 'board') {
    body += `<div class="card center"><h3>The host is picking a question…</h3><p class="muted">Eyes on the big screen 👀</p></div>`;
  } else if (S.phase === 'question' && S.current) {
    const c = S.current;
    const locked = c.lockedTeamIds.includes(me.teamId);
    if (c.phase === 'waiting') {
      body += `<div class="card center"><h3 class="gold">Question is open</h3><p class="muted">${c.lastResult === 'wrong-continue' ? 'That answer was wrong — the host will reopen buzzing for the remaining teams.' : 'Listen to the question — the host will open buzzing when ready…'}</p>
        ${me.isCaptain ? '<p>⭐ Captains: get ready to buzz.</p>' : ''}</div>`;
    } else if (c.phase === 'buzz') {
      if (!me.isCaptain) body += `<div class="card center"><h3>Buzzing is open!</h3><p class="muted">Your captain has the buzzer.</p></div>`;
      else if (locked) body += `<div class="card center"><h3>Your team is locked out of this one</h3><p class="muted">A wrong answer earlier — sit this question out.</p></div>`;
      else body += `<button class="buzzer" id="p_buzz">BUZZ!</button>`;
    } else if (c.phase === 'rebuzz') {
      const tName = (S.teams.find(t=>t.id===c.lastTimeoutTeamId)||{}).name || 'A team';
      body += `<div class="card center"><h3>⏱ ${esc(tName)} ran out of time!</h3><p class="muted">No answer in time — points deducted, and that team is out for this question. Buzzing reopens in <b><span class="js-cd" data-end="${c.phaseEndsAt}">${Math.max(0, Math.ceil(((c.phaseEndsAt||now())-now())/1000))}</span>s</b>…</p>
        ${locked ? '<p>Your team is locked out of this question.</p>' : me.isCaptain ? '<p>⭐ Captains: get ready to buzz again!</p>' : ''}</div>`;
    } else if (c.phase === 'answer') {
      const mine = c.buzzWinnerTeamId === me.teamId;
      if (!mine) body += `<div class="card center"><h3>${esc((S.teams.find(t=>t.id===c.buzzWinnerTeamId)||{}).name || 'Another team')} is answering…</h3></div>`;
      else if (!me.isCaptain) body += `<div class="card center"><h3>Your team got it!</h3><p class="muted">Your captain is answering.</p></div>`;
      else if (c.hostJudge && c.myPick != null) body += `<div class="card center"><h3 class="gold">You picked ${'ABCD'[c.myPick] || ''} ✓</h3><p class="muted">Waiting for the host to judge…</p></div>`;
      else if (c.options) body += `<div class="card"><h3 class="center gold">Your answer? ${c.answerDeadline ? '(<span class="js-cd" data-end="' + c.answerDeadline + '">' + Math.max(0, Math.ceil((c.answerDeadline-now())/1000)) + '</span>s)' : ''}</h3>
        ${c.answerDeadline ? '<div class="timerbar"><i class="js-tfill" data-end="' + c.answerDeadline + '" data-total="' + (S.answerSeconds || 15) + '"></i></div>' : ''}
        <div class="opts">${c.options.map((op,i)=>`<button class="opt" data-ans="${i}"><span class="letter">${'ABCD'[i]}</span>${esc(op)}</button>`).join('')}</div></div>`;
      else body += `<div class="card center"><h3 class="gold">Shout your answer!</h3><p class="muted">The host will judge it. ${c.answerDeadline ? '<span class="js-cd" data-end="' + c.answerDeadline + '">' + Math.max(0, Math.ceil((c.answerDeadline-now())/1000)) + '</span>s left' : ''}</p>
        ${c.answerDeadline ? '<div class="timerbar"><i class="js-tfill" data-end="' + c.answerDeadline + '" data-total="' + (S.answerSeconds || 15) + '"></i></div>' : ''}</div>`;
    } else if (c.phase === 'reveal') {
      const winnerName = (S.teams.find(t=>t.id===c.buzzWinnerTeamId)||{}).name;
      body += `<div class="card center">${c.lastResult==='correct' ? `<h3>✅ ${esc(winnerName||'')} got it right! +${c.points}</h3>` : '<h3>❌ That question is closed.</h3>'}
        ${c.revealedAnswer ? `<p style="font-size:20px">Correct answer: <b class="gold">${esc(c.revealedAnswer)}</b></p>` : c.hostJudge ? '<p class="muted">The host judged this one from the slides.</p>' : '<p class="muted">The correct answer is on the big screen.</p>'}</div>`;
    }
  } else if (S.phase === 'final_answer' && S.finalHostScored) {
    if (!me.isCaptain) body += `<div class="card center"><h3 class="gold">Final Jeopardy</h3><p class="muted">Your captain is sending the team's answer to the host on Slack.</p></div>`;
    else body += `<div class="card center"><h3 class="gold">FINAL JEOPARDY — Send Your Answer on Slack</h3>
      <p class="muted" style="font-size:16px">Send your team's answer / argument to the host on <b>Slack</b> — there's nothing to type in this app.<br>The host will present every team's answer, then voting opens here.</p></div>`;
  } else if (S.phase === 'final_vote') {
    const others = S.teams.filter(t => t.id !== me.teamId);
    const reported = !!(me.teamId && S.finalReported && S.finalReported[me.teamId]);
    if (!me.isCaptain) body += `<div class="card center"><h3 class="gold">Final Jeopardy — Voting</h3><p class="muted">The host has presented all the answers. Discuss with your team and vote for <b>another</b> team's answer — your captain reports your team's vote counts.</p></div>`;
    else if (reported) body += `<div class="card center"><h3 class="gold">✓ Votes reported</h3><p class="muted">Waiting for the other captains to report…</p></div>`;
    else body += `<div class="card"><h3 class="center gold">Report Voting</h3>
      <p class="muted">Count how many of your team voted for each other team's answer (you can't vote for your own), enter the numbers, then confirm.</p>
      ${others.map(t => `<label>${esc(t.name)} — votes from your team</label><input type="number" min="0" inputmode="numeric" id="rv_${t.id}" value="0">`).join('')}
      <div style="height:10px"></div><button class="big" id="p_report">Report Voting ✓</button></div>`;
  } else if (S.phase === 'final_reveal') {
    const r = S.finalResult || { winnerTeamIds: [], winnerVotes: 0, totalVotes: 0 };
    const winners = S.teams.filter(t => r.winnerTeamIds.includes(t.id));
    body += `<div class="champ"><div class="trophy">🗳️</div><div class="muted" style="letter-spacing:3px">FINAL JEOPARDY WINNER</div>
      ${winners.length ? `<div class="wname">${winners.map(t=>esc(t.name)).join(' & ')}</div><div style="font-size:24px"><b class="gold">${r.winnerVotes}</b> / ${r.totalVotes} votes</div><div style="font-size:17px;margin-top:4px">Winner earns <b class="gold">+${S.finalPoints}</b> points</div>` : '<div class="wname">No votes cast</div>'}</div>`;
  } else if (S.phase === 'final_answer') {
    if (!me.isCaptain) body += `<div class="card center"><h3 class="gold">Final Jeopardy</h3><p class="muted">Your captain is writing the team's answer.</p></div>`;
    else body += `<div class="card"><h3 class="center gold">FINAL JEOPARDY — ${S.finalPoints} points</h3>
      <p class="center muted">Read the question on the big screen. Take your time — there's no time limit.</p>
      <label>Your team's answer</label><input id="p_final" value="${esc(S.myFinalAnswer || '')}">
      <div style="height:10px"></div><button class="big" id="p_final_go">${S.myFinalAnswer ? 'Update Answer' : 'Submit Answer'}</button>
      ${S.myFinalAnswer ? '<div class="ok-banner center">Answer submitted ✓</div>' : ''}</div>`;
  } else if (S.phase === 'final_judge') {
    body += `<div class="card center"><h3 class="gold">Final Jeopardy</h3><p class="muted">The host is judging the final answers…</p></div>`;
  } else if (S.phase === 'finished') {
    const standings = [...S.teams].sort((a,b)=>b.score-a.score);
    const champ = standings[0];
    body += `<div class="champ"><div class="trophy">🏆</div><div class="muted" style="letter-spacing:3px">CHAMPION</div>
      <div class="wname">${champ ? esc(champ.name) : ''}</div><div style="font-size:22px">${champ ? champ.score : 0} points</div>
      ${S.finalResult && S.finalResult.winnerTeamIds.length ? `<p style="margin-top:8px">🗳️ Final Jeopardy winner: <b class="gold">${S.finalResult.winnerTeamIds.map(id => esc((S.teams.find(t=>t.id===id)||{}).name || '')).join(' & ')}</b> (${S.finalResult.winnerVotes}/${S.finalResult.totalVotes} votes)</p>` : ''}
      ${myTeam ? `<p style="margin-top:10px">Your team finished with <b class="gold">${myTeam.score}</b> points.</p>` : ''}</div>`;
    body += recapHTML();
  }
  app.innerHTML = body;
  const bz = $('#p_buzz'); if (bz) bz.onclick = async () => { bz.disabled = true; try { await api('/api/player/buzz', {}, store.player); } catch(e){ /* too early / locked — state will update */ } };
  app.querySelectorAll('[data-ans]').forEach(b => b.onclick = async () => { await api('/api/player/answer', { choiceIndex: +b.dataset.ans }, store.player).catch(()=>{}); });
  const fg = $('#p_final_go'); if (fg) fg.onclick = async () => { await api('/api/player/finalAnswer', { text: $('#p_final').value }, store.player).catch(e=>alert(e.message)); };
  const rp = $('#p_report'); if (rp) rp.onclick = async () => { const votes = {}; app.querySelectorAll('[id^="rv_"]').forEach(inp => { votes[inp.id.slice(3)] = +inp.value || 0; }); rp.disabled = true; await api('/api/player/reportVotes', { votes }, store.player).catch(e=>{ rp.disabled = false; alert(e.message); }); };
}

/* ================= boot ================= */
(function boot(){
  const params = new URL(location.href).searchParams;
  if (params.get('code')) joinCtx.code = params.get('code').toUpperCase();
  if (store.admin) view = 'admin'; else if (store.player) view = 'player'; else view = 'home';
  connectSSE();
  if (view === 'admin') loadTemplates(); else render();
})();
</script>
</body>
</html>
